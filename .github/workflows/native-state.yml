name: Native state filesystem
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
        variant: [host]
        include:
          - runner: ubuntu-24.04
            variant: musl
          - runner: ubuntu-24.04-arm
            variant: musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.variant == 'host'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - if: matrix.variant == 'host'
        run: npm ci
      - if: matrix.variant == 'host'
        run: |
          npm run prebuild --workspace @layervai/qurl-state-fs
          mv packages/state-fs/build "$(mktemp -d)/build"
      - if: matrix.variant == 'host'
        run: npm run build
      - if: matrix.variant == 'host'
        run: npm test -- src/node/file-agent-state.test.ts src/node/agent-runtime.test.ts
      - if: matrix.variant == 'musl'
        run: bash scripts/build-musl-state.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.runner }}-${{ matrix.variant }}
          path: packages/state-fs/prebuilds/
          if-no-files-found: error
