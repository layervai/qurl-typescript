name: Native state filesystem
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - run: npm ci
      - run: npm run prebuild --workspace @layervai/qurl-state-fs
      - run: npm run build
      - run: npm test -- src/node/file-agent-state.test.ts src/node/agent-runtime.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.runner }}
          path: packages/state-fs/prebuilds/
          if-no-files-found: error
