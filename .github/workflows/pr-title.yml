name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Release Please uses chore(main) for default-branch releases.
          scopes: |
            client
            types
            api
            ci
            deps
            deps-dev
            main
          requireScope: false
          subjectPattern: ^[a-z].*$
          subjectPatternError: |
            Subject must start with a lowercase letter.
            Example: "feat(client): add batch resolve helper"
